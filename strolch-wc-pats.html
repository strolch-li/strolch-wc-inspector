<link rel="import" href="../polymer/polymer.html">
<link rel="import" href="../iron-ajax/iron-ajax.html">
<link rel="import" href="../paper-button/paper-button.html">
<link rel="import" href="../paper-icon-button/paper-icon-button.html">
<link rel="import" href="../paper-material/paper-material.html">
<link rel="import" href="../iron-icons/iron-icons.html">
<link rel="import" href="../strolch-wc-styles/strolch-wc-styles.html">

<link rel="import" href="strolch-wc-inspector-behavior.html">
<link rel="import" href="strolch-wc-privilege-dialog.html">
<link rel="import" href="strolch-wc-pat-create-dialog.html">

<dom-module id="strolch-wc-pats">
	<template>
		<style include="strolch-wc-styles">
			:host {
				display: block;
				padding: 16px;
			}

			.token-card {
				padding: 16px;
				margin-bottom: 16px;
				display: flex;
				justify-content: space-between;
				align-items: center;
				cursor: pointer;
			}

			.token-card:hover {
				background-color: #f9f9f9;
			}

			.token-info {
				flex-grow: 1;
			}

			.token-name {
				font-size: 1.2em;
				font-weight: bold;
			}

			.token-details {
				font-size: 0.9em;
				color: var(--secondary-text-color);
			}

			.token-user {
				font-size: 0.85em;
				font-weight: normal;
				color: var(--secondary-text-color);
				margin-left: 8px;
			}

			.actions {
				display: flex;
				justify-content: flex-end;
				margin-bottom: 16px;
			}
		</style>

		<iron-ajax id="ajaxList"
				   url="[[baseRestPath]]/strolch/privilege/tokens"
				   method="GET"
				   content-type="application/json"
				   handle-as="json"
				   on-response="_onListResponse"
				   on-error="_onError"></iron-ajax>

		<iron-ajax id="ajaxPrivileges"
				   method="GET"
				   content-type="application/json"
				   handle-as="json"
				   on-response="_onPrivilegesResponse"
				   on-error="_onError"></iron-ajax>

		<iron-ajax id="ajaxRevoke"
				   method="DELETE"
				   content-type="application/json"
				   handle-as="json"
				   on-response="_onRevokeResponse"
				   on-error="_onError"></iron-ajax>

		<div class="actions">
			<paper-button raised on-tap="_showCreateDialog">
				<iron-icon icon="add"></iron-icon>
				[[localize('create')]]
			</paper-button>
		</div>

		<template is="dom-repeat" items="[[tokens]]" as="token">
			<paper-material class="token-card" elevation="1" on-tap="_showDetails">
				<div class="token-info">
					<div class="token-name">
						[[token.name]]
						<template is="dom-if" if="[[token.username]]">
							<span class="token-user">([[token.username]])</span>
						</template>
					</div>
					<div class="token-details">
						<span>[[localize('validFrom')]]: [[_formatDate(token.validFrom)]]</span> |
						<span>[[localize('validTo')]]: [[_formatDate(token.validTo)]]</span> |
						<span>[[localize('lastUsed')]]: [[_formatDate(token.lastUsed)]]</span>
					</div>
				</div>
				<div class="token-actions">
					<paper-icon-button icon="delete" title="[[localize('revoke')]]"
									   on-tap="_confirmRevoke"></paper-icon-button>
				</div>
			</paper-material>
		</template>

		<strolch-wc-pat-create-dialog id="createDialog"
									  base-rest-path="[[baseRestPath]]"
									  locales-path="[[localesPath]]"
									  on-strolch-pat-created="reload"></strolch-wc-pat-create-dialog>

		<strolch-wc-privilege-dialog id="privilegeDialog"></strolch-wc-privilege-dialog>

	</template>

	<script>
		Polymer({
			is: 'strolch-wc-pats',

			behaviors: [
				StrolchInspectorBehavior
			],

			properties: {
				baseRestPath: {
					type: String,
					value: './rest'
				},
				localesPath: {
					type: String,
					value: './strolch-wc-pats-locales.json'
				},
				username: {
					type: String,
					value: null,
					observer: '_usernameChanged'
				},
				userId: {
					type: String,
					value: null
				},
				tokens: {
					type: Array,
					value: []
				},
				availablePrivileges: {
					type: Array,
					value: []
				}
			},

			_usernameChanged: function () {
				if (this.isAttached) {
					this.reload();
				}
			},

			attached: function () {
				this.reload();
			},

			reload: function () {
				this.$.ajaxList.headers = {'Authorization': Strolch.getAuthToken()};
				if (this.username) {
					this.$.ajaxList.params = {username: this.username};
				} else {
					this.$.ajaxList.params = {};
				}
				this.$.ajaxList.generateRequest();

				this._fetchPrivileges(this.userId);
			},

			_fetchPrivileges: function (userId) {
				var targetUser = (userId && userId.trim().length > 0) ? userId.trim() : (this.userId || (Strolch.getUserConfig() && Strolch.getUserConfig().userId));
				if (targetUser && this.baseRestPath) {
					this.$.ajaxPrivileges.url = this.baseRestPath + '/strolch/privilege/users/' + targetUser + '/privileges';
					this.$.ajaxPrivileges.headers = {'Authorization': Strolch.getAuthToken()};
					this.$.ajaxPrivileges.generateRequest();
				}
			},

			_showCreateDialog: function () {
				var targetUsername = this.username;
				var targetUserId = this.userId;
				if (!targetUsername && !targetUserId && typeof Strolch !== 'undefined' && Strolch.getUserConfig && Strolch.getUserConfig()) {
					var userConfig = Strolch.getUserConfig();
					targetUsername = userConfig.username || null;
					targetUserId = userConfig.userId || null;
				}
				this.openCreateDialogForUser(targetUsername, targetUserId);
			},

			openCreateDialogForUser: function (targetUsername, targetUserId) {
				this.$.createDialog.open(targetUsername, targetUserId);
			},

			_confirmRevoke: function (e) {
				var token = e.model.token;
				e.stopPropagation();
				if (confirm(this.localize('confirmRevoke'))) {
					this.$.ajaxRevoke.url = this.baseRestPath + '/strolch/privilege/tokens/' + token.tokenId;
					this.$.ajaxRevoke.headers = {'Authorization': Strolch.getAuthToken()};
					this.$.ajaxRevoke.generateRequest();
				}
			},

			_onListResponse: function (e) {
				this.tokens = e.detail.response;
			},

			_showDetails: function (e) {
				var token = e.model.token;
				this.$.privilegeDialog.open(token, this.availablePrivileges);
			},

			_onPrivilegesResponse: function (e) {
				this.availablePrivileges = e.detail.response.privileges;
			},

			_onRevokeResponse: function (e) {
				if (e.detail.response && e.detail.response.state === 'SUCCESS') {
					alert(this.localize('revokeSuccess'));
				} else if (e.detail.response && e.detail.response.message) {
					alert(e.detail.response.message);
				}
				this.reload();
			},

			_onError: function (e) {
				this.onRequestError(e);
			},

			_formatDate: function (dateStr) {
				if (!dateStr || dateStr === "-") return "-";
				return new Date(dateStr).toLocaleString();
			}
		});
	</script>
</dom-module>
