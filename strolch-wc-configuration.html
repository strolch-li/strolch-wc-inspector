<link rel="import" href="../polymer/polymer.html">

<link rel="import" href="../iron-ajax/iron-ajax.html">
<link rel="import" href="../iron-pages/iron-pages.html">
<link rel="import" href="../iron-icon/iron-icon.html">
<link rel="import" href="../iron-icons/iron-icons.html">

<link rel="import" href="../paper-styles/color.html">
<link rel="import" href="../paper-material/paper-material.html">
<link rel="import" href="../paper-button/paper-button.html">
<link rel="import" href="../paper-icon-button/paper-icon-button.html">
<link rel="import" href="../paper-dropdown-menu/paper-dropdown-menu.html">
<link rel="import" href="../paper-item/paper-item.html">
<link rel="import" href="../paper-listbox/paper-listbox.html">
<link rel="import" href="../paper-input/paper-input.html">
<link rel="import" href="../paper-checkbox/paper-checkbox.html">

<link rel="import" href="../strolch-wc-styles/strolch-wc-styles.html">
<link rel="import" href="../strolch-wc-localize-behavior/strolch-wc-localize-behavior.html">
<link rel="import" href="strolch-wc-inspector-behavior.html">

<dom-module id="strolch-wc-configuration">

	<template>

		<style is="custom-style" include="strolch-wc-styles">

			:host {
				display: block;
				margin: 0;
				padding: 0;
				height: 100%;
			}

			paper-material {
				background: white;
				margin-top: 1em;
				margin-bottom: 1em;
				padding: 1em;
			}

			.g-row {
				padding: 8px;
			}

			.section-title {
				font-size: 1.2em;
				font-weight: bold;
				margin-bottom: 1em;
				border-bottom: 1px solid var(--paper-grey-300);
				padding-bottom: 0.5em;
			}

			.parameter-row {
				display: flex;
				align-items: baseline;
				margin-bottom: 0.5em;
			}

			.parameter-name {
				flex: 0 0 300px;
				font-weight: bold;
				padding-right: 1em;
			}

			.parameter-id {
				font-size: 0.9em;
				font-weight: normal;
				color: var(--paper-grey-600);
			}

			.parameter-value {
				flex: 1;
			}

			.policy-row {
				display: flex;
				flex-direction: column;
				margin-bottom: 2em;
				padding: 1em;
				border: 1px solid var(--paper-grey-200);
				border-radius: 4px;
				background-color: var(--paper-grey-50);
			}

			.policy-info {
				margin-bottom: 1em;
			}

			.policy-type {
				font-weight: bold;
				font-size: 1.1em;
			}

			.policy-api {
				font-size: 0.9em;
				color: var(--paper-grey-600);
			}

			.policy-selection {
				width: 100%;
			}

			.policy-mapping-row {
				display: flex;
				align-items: baseline;
				margin-bottom: 1em;
			}

			.policy-mapping-id {
				flex: 0 0 300px;
				padding-right: 1em;
			}

			.policy-mapping-value {
				flex: 1;
			}

			paper-dropdown-menu {
				width: 100%;
			}

		</style>

		<div class="g-row">
			<div class="g-12 g-right">
				<paper-icon-button icon="refresh" title="[[localize('refresh')]]" on-tap="reload"></paper-icon-button>
			</div>
		</div>

		<div class="g-m-3">

			<!-- Configuration Resource -->
			<paper-material elevation="1">
				<div class="section-title">[[localize('strolchConfiguration')]]</div>

				<template is="dom-repeat" items="[[_toArray(configuration.parameterBags)]]" as="bag">
					<div class="g-mb-2">
						<h4 class="g-mt-0">[[bag.name]]</h4>
						<template is="dom-repeat" items="[[_toArray(bag.parameters)]]" as="param">
							<div class="parameter-row">
								<div class="parameter-name">
									<div>[[param.name]]</div>
									<div class="parameter-id">[[param.id]]</div>
								</div>
								<div class="parameter-value">
									<template is="dom-if" if="[[_isBoolean(param.type)]]">
										<paper-checkbox checked="{{param.value}}" on-change="_onParamChanged"></paper-checkbox>
									</template>
									<template is="dom-if" if="[[!_isBoolean(param.type)]]">
										<paper-input no-label-float value="{{param.value}}" type="[[_getInputType(param.type)]]" on-change="_onParamChanged"></paper-input>
									</template>
								</div>
							</div>
						</template>
					</div>
				</template>

				<div class="g-right g-mt-2">
					<paper-button raised on-tap="_updateConfiguration" class="g-secondary">[[localize('updateConfiguration')]]</paper-button>
				</div>
			</paper-material>

			<!-- Policy Model -->
			<paper-material elevation="1">
				<div class="section-title">[[localize('policyModel')]]</div>

				<template is="dom-repeat" items="[[_toArray(policyModel.policyTypes)]]" as="policyType">
					<div class="policy-row">
						<div class="policy-info">
							<div class="policy-type">[[policyType.type]]</div>
							<div class="policy-api">[[policyType.api]]</div>
						</div>
						<div class="policy-selection">
							<template is="dom-repeat" items="[[_toArray(policyType.policyByKeyMap)]]" as="mapping">
								<div class="policy-mapping-row">
									<div class="policy-mapping-id"><b>[[mapping.id]]</b></div>
									<div class="policy-mapping-value">
										<paper-dropdown-menu no-label-float label="[[localize('implementation')]]">
											<paper-listbox class="dropdown-content" attr-for-selected="value" selected="{{mapping.value}}" on-iron-select="_onPolicyChanged">
												<template is="dom-repeat" items="[[policyType.possibleImplementations]]" as="impl">
													<paper-item value="[[impl]]">[[impl]]</paper-item>
												</template>
											</paper-listbox>
										</paper-dropdown-menu>
									</div>
								</div>
							</template>
						</div>
					</div>
				</template>

				<div class="g-right g-mt-2">
					<paper-button raised on-tap="_updatePolicyModel" class="g-secondary">[[localize('updatePolicyModel')]]</paper-button>
				</div>
			</paper-material>

		</div>

		<iron-ajax id="ajaxGetConfig"
				   url="[[baseRestPath]]/strolch/configuration/resource"
				   method="GET"
				   content-type="application/json"
				   handle-as="json"
				   on-response="_onConfigResponse"
				   on-error="onAjaxError"></iron-ajax>

		<iron-ajax id="ajaxPutConfig"
				   url="[[baseRestPath]]/strolch/configuration/resource"
				   method="PUT"
				   content-type="application/json"
				   handle-as="json"
				   on-response="_onUpdateResponse"
				   on-error="onAjaxError"></iron-ajax>

		<iron-ajax id="ajaxGetPolicies"
				   url="[[baseRestPath]]/strolch/configuration/policies"
				   method="GET"
				   content-type="application/json"
				   handle-as="json"
				   on-response="_onPoliciesResponse"
				   on-error="onAjaxError"></iron-ajax>

		<iron-ajax id="ajaxPutPolicies"
				   url="[[baseRestPath]]/strolch/configuration/policies"
				   method="PUT"
				   content-type="application/json"
				   handle-as="json"
				   on-response="_onUpdateResponse"
				   on-error="onAjaxError"></iron-ajax>

	</template>

	<script>
		Polymer({
			is: 'strolch-wc-configuration',

			behaviors: [
				StrolchInspectorBehavior,
				StrolchLocalizeBehavior
			],

			properties: {
				localesPath: {
					type: String,
					value: './strolch-wc-configuration-locales.json'
				},
				configuration: {
					type: Object,
					value: function () {
						return {};
					}
				},
				policyModel: {
					type: Object,
					value: function () {
						return {};
					}
				}
			},

			attached: function () {
				this.reload();
			},

			reload: function () {
				this.$.ajaxGetConfig.generateRequest();
				this.$.ajaxGetPolicies.generateRequest();
			},

			_onConfigResponse: function (e) {
				this.configuration = e.detail.response.data;
			},

			_onPoliciesResponse: function (e) {
				this.policyModel = e.detail.response.data;
			},

			_onUpdateResponse: function (e) {
				this.reload();
				this.fire('strolch-show-notification', {
					title: this.localize('success'),
					message: this.localize('configurationUpdated')
				});
			},

			_updateConfiguration: function () {
				this.$.ajaxPutConfig.body = JSON.stringify(this.configuration);
				this.$.ajaxPutConfig.generateRequest();
			},

			_updatePolicyModel: function () {
				this.$.ajaxPutPolicies.body = JSON.stringify(this.policyModel);
				this.$.ajaxPutPolicies.generateRequest();
			},

			_toArray: function (obj) {
				if (!obj) return [];
				var array = Object.keys(obj).map(function (key) {
					var val = obj[key];
					if (typeof val === 'object' && val !== null && !Array.isArray(val)) {
						val.id = key;
					} else {
						val = {id: key, value: val};
					}
					return val;
				});
				// Ensure name is present for display if not provided by API
				array.forEach(function (item) {
					if (!item.name) item.name = item.id;
				});
				return array;
			},

			_isBoolean: function (type) {
				return type === 'Boolean';
			},

			_getInputType: function (type) {
				if (type === 'Integer' || type === 'Float' || type === 'Long') {
					return 'number';
				}
				return 'text';
			},

			_onParamChanged: function (e) {
				// Polymer 1.x data binding might need some help if not using {{}} correctly, 
				// but here we use {{param.value}} so it should be fine.
			},

			_onPolicyChanged: function (e) {
				// Same as above
			}
		});
	</script>

</dom-module>
