<link rel="import" href="../strolch-wc-util-behavior/strolch-wc-component-behavior.html">

<script>
    StrolchInspectorBehaviorImpl = {

        properties: {
            basePath: {
                type: String,
                value: './'
            },
            dlgTitle: {
                type: String
            },
            dlgText: {
                type: String
            }
        },

        toLocalDateTime: function (val) {
            if (val == null || val.startsWith("1970-01-01T01:00:00"))
                return "-";
            return Strolch.toLocalDateTime(val);
        },

        isEmptyArray: function (arr) {
            return arr == null || arr.length === 0;
        },
        isNotEmptyArray: function (list) {
            return !this.isEmptyArray(list);
        },

        onAjaxError: function (e) {
            this.onRequestError(e);
        }
    };

    StrolchInspectorBehavior = [StrolchInspectorBehaviorImpl, StrolchComponentBehavior];
</script>
