<link rel="import" href="../polymer/polymer.html">

<link rel="import" href="../iron-ajax/iron-ajax.html">
<link rel="import" href="../iron-pages/iron-pages.html">
<link rel="import" href="../iron-icons/iron-icons.html">

<link rel="import" href="../paper-styles/color.html">

<link rel="import" href="../paper-material/paper-material.html">
<link rel="import" href="../paper-dialog/paper-dialog.html">
<link rel="import" href="../paper-input/paper-input.html">
<link rel="import" href="../paper-button/paper-button.html">
<link rel="import" href="../paper-icon-button/paper-icon-button.html">

<link rel="import" href="../paper-dropdown-menu/paper-dropdown-menu.html">
<link rel="import" href="../paper-item/paper-item.html">
<link rel="import" href="../paper-listbox/paper-listbox.html">

<link rel="import" href="../paper-tabs/paper-tabs.html">

<link rel="import" href="../strolch-wc-styles/strolch-wc-app-style.html">

<link rel="import" href="strolch-wc-inspector-behavior.html">
<link rel="import" href="strolch-wc-group.html">
<link rel="import" href="strolch-wc-privilege-dialog.html">

<dom-module id="strolch-wc-groups">

    <template>

        <style is="custom-style" include="strolch-wc-app-style">

            :host {
                display: block;
                margin: 0;
                padding: 0;
                height: 100%;
            }

        </style>

        <div class="actions actions-right">
            <paper-button on-tap="_openAddGroupDlg" raised>Add</paper-button>
            <paper-icon-button icon="refresh" title="Refresh" on-tap="reload"></paper-icon-button>
        </div>

        <template is="dom-repeat" items="[[groups]]" as="group">
            <strolch-wc-group base-path="[[basePath]]"
                              group="[[group]]"
                              on-strolch-remove-group="onRemoveGroup"
                              on-strolch-page-reload="onReload"></strolch-wc-group>
        </template>

        <paper-dialog id="addGroupDlg" modal>
            <h2>[[dlgTitle]]</h2>

            <paper-input label="group name" value="{{groupName}}"></paper-input>

            <div class="buttons">
                <paper-button dialog-confirm autofocus>Close</paper-button>
                <paper-button on-tap="_addGroup">Add</paper-button>
            </div>
        </paper-dialog>

        <iron-ajax id="ajax"
                   content-type="application/json"
                   handle-as="json"
                   on-response="_handleAjaxResponse"
                   on-error="onAjaxError"></iron-ajax>

        <strolch-wc-privilege-dialog id="privilegesDlg"></strolch-wc-privilege-dialog>

    </template>

    <script>

        Polymer({

            is: 'strolch-wc-groups',

            behaviors: [
                StrolchInspectorBehavior
            ],

            properties: {
                groups: {
                    type: Array
                },
                groupName: {
                    type: String
                },
                searchTerm: {
                    type: String,
                    observer: 'searchTermChanged'
                },
                propagateShowDialog: {
                    type: Boolean,
                    value: function () {
                        return false
                    }
                }
            },

            listeners: {
                "strolch-show-dialog": "onShowDialog"
            },
            onShowDialog: function (event) {
                if (!this.propagateShowDialog) {
                    event.cancelBubble = true;
                    event.stopPropagation();
                    this.showError(event.detail.title, event.detail.text);
                }
            },
            showError: function (title, text) {
                this.dlgTitle = title;
                this.dlgText = text;
                console.log('ERROR: ' + this.dlgTitle + ': ' + this.dlgText);
                this.$.dlg.open();
            },

            searchTermChanged: function (newValue) {
                if (newValue != null)
                    this.reload();
            },

            ready: function () {
                //
            },

            onReload: function (e) {
                this.reload();
            },

            reload: function () {

                this.dlgTitle = 'Groups query failed';
                this._handleAjaxResponse = function (data) {
                    this.groups = data.detail.response;
                };

                this.$.ajax.url = this.basePath + 'rest/strolch/privilege/groups';
                this.$.ajax.method = 'GET';
                this.$.ajax.params = {query: this.searchTerm};
                this.$.ajax.generateRequest();
            },

            _openAddGroupDlg: function (e) {
                this.dlgTitle = 'Add Group';
                this.$.addGroupDlg.open();
            },

            _addGroup: function (e) {
                if (this.isEmptyString(this.groupName)) {
                    return;
                }

                this.push('groups', {
                    isNew: true,
                    name: this.groupName,
                    roles: [],
                    properties: []
                });

                this.groupName = '';
                this.$.addGroupDlg.close();
            },

            onRemoveGroup: function (e) {

                var _group = e.detail.group;
                if (!confirm('Do you really want to delete group ' + _group.name)) {
                    return;
                }

                if (_group.isNew) {
                    this.reload();
                    return;
                }

                this.dlgTitle = 'Remove group failed';
                this._handleAjaxResponse = function (data) {
                    this.reload();
                };

                this.$.ajax.url = this.basePath + 'rest/strolch/privilege/groups/' + _group.name;
                this.$.ajax.method = 'DELETE';
                this.$.ajax.body = {};
                this.$.ajax.generateRequest();
            },

            _showPrivileges: function (e) {
                var group = e.model.item;
                this._handleAjaxResponse = function (data) {
                    this.$.privilegesDlg.open(data.detail.response);
                };

                this.$.ajax.url = this.basePath + "rest/strolch/privilege/users/" + group.name + "/privileges";
                this.$.ajax.method = 'GET';
                this.$.ajax.params = {};
                this.$.ajax.generateRequest();
            },

            _handleAjaxResponse: function (evt) {
                console.log('NOT YET DEFINED!');
            }
        });

    </script>

</dom-module>
