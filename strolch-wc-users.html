<link rel="import" href="../polymer/polymer.html">

<link rel="import" href="../iron-ajax/iron-ajax.html">
<link rel="import" href="../iron-pages/iron-pages.html">
<link rel="import" href="../iron-icons/iron-icons.html">

<link rel="import" href="../paper-styles/color.html">

<link rel="import" href="../paper-material/paper-material.html">
<link rel="import" href="../paper-dialog/paper-dialog.html">
<link rel="import" href="../paper-input/paper-input.html">
<link rel="import" href="../paper-button/paper-button.html">
<link rel="import" href="../paper-icon-button/paper-icon-button.html">

<link rel="import" href="../paper-dropdown-menu/paper-dropdown-menu.html">
<link rel="import" href="../paper-item/paper-item.html">
<link rel="import" href="../paper-listbox/paper-listbox.html">

<link rel="import" href="../paper-tabs/paper-tabs.html">

<link rel="import" href="../strolch-wc-styles/strolch-wc-styles.html">

<link rel="import" href="strolch-wc-inspector-behavior.html">
<link rel="import" href="strolch-wc-inspector-paging-behavior.html">
<link rel="import" href="strolch-wc-privilege-dialog.html">

<dom-module id="strolch-wc-users">

    <template>
        <style is="custom-style" include="strolch-wc-app-style">
            :host {
                display: block;
                margin: 0;
                padding: 0;
            }

            .dialog-content {
                --paper-dialog-scrollable: {
                    max-height: 600px;
                }
            }

            paper-material {
                padding: 4px;
                margin: 0 0 8px;
            }

            .list {
                max-height: 250px;
                overflow: auto;
            }

            .table {
                min-width: 100%;
                display: flex;
                flex-direction: column;
            }

            .table-row {
                box-sizing: border-box;
                display: flex;
                flex-direction: row;
                margin-top: -1px;
                padding-top: 5px;
                padding-bottom: 5px;
            }

            .table-heading {
                font-weight: bold;
            }

            .table-heading,
            .table-cell {
                display: flex;
                padding: 0 12px;
                overflow: hidden;
                align-items: center;
                flex-basis: 80px;
                flex-grow: 1;
                flex-shrink: 0;
                justify-content: flex-start;
                min-height: 48px;
            }

            .locale {
                flex-grow: 1;
                flex-shrink: 1;
                flex-basis: 30px;
            }

            .state {
                flex-grow: 1;
                flex-shrink: 1;
                flex-basis: 50px;
            }

            .username {
                flex-grow: 2;
                flex-shrink: 2;
                flex-basis: 250px;
            }

            .actions {
                flex-grow: 1;
                flex-shrink: 1;
                flex-basis: 80px;
                flex-wrap: wrap;
            }

            .history {
                flex-grow: 1;
                flex-shrink: 1;
                flex-basis: 200px;
            }

            .data {
                padding-top: 10px;
                padding-bottom: 10px;
            }

            .data:nth-child(even) {
                background: #f7f7f7;
            }

            .top > .table-col {
                padding-left: 4px;
                padding-right: 4px;
            }

            .groups-and-roles {
                flex-grow: 1;
                flex-shrink: 1;
                display: block;
                flex-direction: column;
                flex-basis: 100px;
            }

        </style>

        <div class="actions actions-right">
            <paper-button on-tap="_addUser" raised>Add</paper-button>
            <paper-icon-button icon="refresh" title="Refresh" on-tap="reload"></paper-icon-button>
        </div>

        <paper-material elevation="1">

            <div class="table">
                <div class="table-row">
                    <div class="table-heading username">Username / Name</div>
                    <div class="table-heading state">State</div>
                    <div class="table-heading locale">Locale</div>
                    <div class="table-heading roles">Groups and Roles</div>
                    <div class="table-heading history">History</div>
                    <div class="table-heading actions"></div>
                </div>

                <template is="dom-repeat" items="[[dataObj.data]]">
                    <div class="table-row data">
                        <div class="table-cell username">[[item.username]]<br/><br/>[[_getName(item)]]</div>
                        <div class="table-cell state">[[item.userState]]</div>
                        <div class="table-cell locale">[[item.locale]]</div>
                        <div class="table-cell groups-and-roles">
                            <template is="dom-if" if="[[isEmptyString(item.groups)]]">
                                <p><b>Groups:</b> <i>(none)</i></p>
                            </template>
                            <template is="dom-if" if="[[isNotEmptyString(item.groups)]]">
                                <p><b>Groups:</b> [[arrayToString(item.groups)]]</p>
                            </template>

                            <template is="dom-if" if="[[isEmptyString(item.roles)]]">
                                <p><b>Roles:</b> <i>(none)</i></p>
                            </template>
                            <template is="dom-if" if="[[isNotEmptyString(item.roles)]]">
                                <p><b>Roles:</b> [[arrayToString(item.roles)]]</p>
                            </template>
                        </div>
                        <div class="table-cell history">
                            FirstLogin: [[toLocalDateTime(item.history.firstLogin)]]<br/> LastLogin:
                            [[toLocalDateTime(item.history.lastLogin)]]<br/> PasswordChange:
                            [[toLocalDateTime(item.history.lastPasswordChange)]]
                        </div>
                        <div class="table-cell actions">
                            <paper-icon-button icon="create" title="Edit" on-tap="_editUser"></paper-icon-button>
                            <paper-icon-button icon="lock-outline"
                                               title="Set password"
                                               on-tap="_openPwDlg"></paper-icon-button>
                            <paper-icon-button icon="delete" title="Remove" on-tap="_removeUser"></paper-icon-button>
                            <paper-icon-button icon="icons:assignment" title="Privileges"
                                               on-tap="_showPrivileges"></paper-icon-button>

                        </div>
                    </div>
                </template>
            </div>

            <div class="g-row">
                <div class="g-3"></div>
                <div class="g-6">
                    <div class="g-m-2 g-center">
                        <paper-icon-button icon="first-page" on-tap="_toFirstPage"></paper-icon-button>
                        <paper-icon-button icon="chevron-left" on-tap="_toPreviousPage"></paper-icon-button>
                        <span>[[dataObj.offset]] to [[_getEnd(dataObj)]] of [[dataObj.size]] ([[dataObj.dataSetSize]])</span>
                        <paper-icon-button icon="chevron-right" on-tap="_toNextPage"></paper-icon-button>
                        <paper-icon-button icon="last-page" on-tap="_toLastPage"></paper-icon-button>
                    </div>
                </div>
                <div class="g-3">
                    <paper-button on-tap="_setLimit">10</paper-button>
                    <paper-button on-tap="_setLimit">50</paper-button>
                    <paper-button on-tap="_setLimit">100</paper-button>
                </div>
            </div>

        </paper-material>

        <paper-dialog id="dlg" modal>
            <h2>[[dlgTitle]]</h2>
            <p>[[dlgText]]</p>
            <div class="buttons">
                <paper-button dialog-confirm autofocus>Close</paper-button>
            </div>
        </paper-dialog>

        <strolch-wc-privilege-dialog id="privilegesDlg"></strolch-wc-privilege-dialog>

        <paper-dialog id="pwDlg" modal>
            <h2>Set Password for [[user.username]]</h2>
            <paper-input label="Password" value="{{password0}}" type="password"></paper-input>
            <paper-input label="Repeat" value="{{password1}}" type="password"></paper-input>
            <div class="buttons">
                <paper-button on-tap="_requireChange">Require Change</paper-button>
                <paper-button on-tap="_clearPassword">Clear</paper-button>
                <paper-button dialog-confirm autofocus>Close</paper-button>
                <paper-button on-tap="_setPassword" autofocus>Save</paper-button>
            </div>
        </paper-dialog>

        <paper-dialog id="userDlg" modal>
            <h2>
                <template is="dom-if" if="[[isEmptyString(user.userId)]]">New User</template>
                <template is="dom-if" if="[[isNotEmptyString(user.userId)]]">Edit User</template>
            </h2>

            <paper-dialog-scrollable class="dialog-content">

                <div class="table">
                    <div class="table-row top">
                        <div class="table-col">
                            <paper-input label="UserId" value="{{user.userId}}" readonly></paper-input>
                            <paper-input label="Username"
                                         value="{{user.username}}"
                                         readonly="[[isNotEmptyString(user.userId)]]"></paper-input>

                            <paper-input label="Firstname" value="{{user.firstname}}"></paper-input>
                            <paper-input label="Lastname" value="{{user.lastname}}"></paper-input>

                            <paper-dropdown-menu always-float-label label="Locale" class="custom">
                                <paper-listbox label="Locale"
                                               attr-for-selected="value"
                                               class="dropdown-content"
                                               selected="{{user.locale}}">
                                    <paper-item value="en">English</paper-item>
                                    <paper-item value="de">German</paper-item>
                                    <paper-item value="fr">French</paper-item>
                                </paper-listbox>
                            </paper-dropdown-menu>

                            <paper-dropdown-menu always-float-label label="State" class="custom">
                                <paper-listbox attr-for-selected="value" class="dropdown-content"
                                               selected="{{user.userState}}">

                                    <paper-item value="NEW">NEW</paper-item>
                                    <paper-item value="EXPIRED">EXPIRED</paper-item>
                                    <paper-item value="ENABLED">ENABLED</paper-item>
                                    <paper-item value="DISABLED">DISABLED</paper-item>
                                    <paper-item value="SYSTEM">SYSTEM</paper-item>

                                </paper-listbox>
                            </paper-dropdown-menu>
                        </div>

                        <div class="table-col">
                            <p>Groups:</p>
                            <div class="list">
                                <template is="dom-repeat" items="[[user.groups]]">
                                    <paper-item value="[[item]]">
                                        <paper-icon-button icon="remove-circle-outline"
                                                           title="Remove"
                                                           on-tap="_removeGroup"></paper-icon-button>
                                        [[item]]
                                    </paper-item>
                                </template>
                            </div>
                            <paper-button on-tap="_openAddGroupDlg">Add Group</paper-button>

                            <p>Roles:</p>
                            <div class="list">
                                <template is="dom-repeat" items="[[user.roles]]">
                                    <paper-item value="[[item]]">
                                        <paper-icon-button icon="remove-circle-outline"
                                                           title="Remove"
                                                           on-tap="_removeRole"></paper-icon-button>
                                        [[item]]
                                    </paper-item>
                                </template>
                            </div>
                            <paper-button on-tap="_openAddRoleDlg">Add Role</paper-button>
                        </div>

                    </div>

                    <div class="table-row">
                        <div class="table-col">
                            <p>Properties:</p>
                            <template is="dom-repeat" items="[[user.properties]]" as="property">
                                <div class="g-row">
                                    <div class="g-5">
                                        <paper-input value="{{property.key}}"></paper-input>
                                    </div>
                                    <div class="g-5 g-pl-4">
                                        <paper-input value="{{property.value}}"></paper-input>
                                    </div>
                                    <div class="g-2" style="line-height: 62px">
                                        <paper-icon-button icon="clear"
                                                           title="Remove"
                                                           on-tap="_removeProperty"></paper-icon-button>
                                    </div>
                                </div>
                            </template>

                            <paper-button class="g-pull-right" on-tap="_addEmptyProperty">Add</paper-button>
                        </div>
                    </div>
                </div>

            </paper-dialog-scrollable>

            <div class="buttons">
                <paper-button dialog-confirm autofocus>Close</paper-button>
                <paper-button on-tap="_addOrUpdateUser" autofocus>Save</paper-button>
            </div>
        </paper-dialog>

        <paper-dialog id="addItemDlg" modal>
            <h2>[[addItemTitle]]</h2>

            <paper-dialog-scrollable class="dialog-content">
                <paper-listbox always-float-label
                               label="[[itemsType]]"
                               class="dropdown-content"
                               attr-for-selected="value"
                               selected="{{selectedItem}}">
                    <template is="dom-repeat" items="[[selectableItems]]">
                        <paper-item value="[[item.name]]">[[item.name]]</paper-item>
                    </template>
                </paper-listbox>
            </paper-dialog-scrollable>

            <div class="buttons">
                <paper-button dialog-confirm autofocus>Close</paper-button>
                <paper-button on-tap="_addItem">Add</paper-button>
            </div>
        </paper-dialog>

        <iron-ajax id="ajax"
                   content-type="application/json"
                   handle-as="json"
                   on-response="_handleAjaxResponse"
                   on-error="onAjaxError"></iron-ajax>

    </template>

    <script>

        Polymer({

            is: "strolch-wc-users",

            behaviors: [
                StrolchInspectorBehavior,
                StrolchInspectorPagingBehavior
            ],

            properties: {
                roles: {
                    type: Array
                },
                users: {
                    type: Array
                },
                user: {
                    type: Object
                },
                selectedItem: {
                    type: Object
                },
                selectableItems: {
                    type: Array,
                    value: []
                },
                addItemTitle: {
                    type: String,
                    value: ""
                },
                itemsType: {
                    type: String,
                    value: ""
                },
                searchTerm: {
                    type: String,
                    observer: "searchTermChanged"
                },
                propagateShowDialog: {
                    type: Boolean,
                    value: function () {
                        return false
                    }
                }
            },

            _getName: function (user) {
                return user.firstname + " " + user.lastname;
            },

            listeners: {
                "strolch-show-dialog": "onShowDialog"
            },
            onShowDialog: function (event) {
                if (!this.propagateShowDialog) {
                    event.cancelBubble = true;
                    event.stopPropagation();
                    this.showError(event.detail.title, event.detail.text);
                }
            },
            showError: function (title, text) {
                this.dlgTitle = title;
                this.dlgText = text;
                console.log("ERROR: " + this.dlgTitle + ": " + this.dlgText);
                this.$.dlg.open();
            },
            _handleAjaxResponse: function (evt) {
                console.log("NOT YET DEFINED!");
            },

            searchTermChanged: function (newValue) {
                if (newValue != null)
                    this.queryPage();
            },
            ready: function () {
                //
            },

            reload: function () {
                this.queryPage();
            },

            queryPage: function () {

                this.dlgTitle = "User query failed";
                this._handleAjaxResponse = function (data) {
                    this.dataObj = data.detail.response;
                };

                this.$.ajax.url = this.basePath + "rest/strolch/privilege/users";
                this.$.ajax.method = "GET";
                this.$.ajax.params = {
                    query: this.searchTerm,
                    offset: this.dataObj.offset,
                    limit: this.dataObj.limit,
                    orderBy: "username"
                };
                this.$.ajax.generateRequest();
            },

            _setPassword: function (e) {

                if (this.isEmptyString(this.password0)) {
                    this.showError("Password invalid", "Password can not be empty!");
                    return;
                }
                if (this.password0 !== this.password1) {
                    this.showError("Password invalid", "Password are not the same!");
                    return;
                }

                this.dlgTitle = "Set password failed";
                this._handleAjaxResponse = function (data) {
                    this.reload();

                    this.password0 = "";
                    this.password1 = "";
                    this.$.pwDlg.close();
                };

                this.$.ajax.url = this.basePath + "rest/strolch/privilege/users/" + this.user.userId + "/password";
                this.$.ajax.method = "PUT";
                this.$.ajax.body = {
                    password: btoa(unescape(encodeURIComponent(this.password0)))
                };
                this.$.ajax.generateRequest();
            },

            _clearPassword: function (e) {
                this.dlgTitle = "Clear password failed";
                this._handleAjaxResponse = function (data) {
                    this.reload();

                    this.password0 = "";
                    this.password1 = "";
                    this.$.pwDlg.close();
                };

                this.$.ajax.url = this.basePath + "rest/strolch/privilege/users/" + this.user.userId + "/password";
                this.$.ajax.method = "DELETE";
                this.$.ajax.body = {};
                this.$.ajax.generateRequest();
            },

            _requireChange: function (e) {
                this.dlgTitle = "Require Password Change failed";
                this._handleAjaxResponse = function (data) {
                    this.reload();

                    this.password0 = "";
                    this.password1 = "";
                    this.$.pwDlg.close();
                };

                this.$.ajax.url = this.basePath + "rest/strolch/privilege/users/" + this.user.userId + "/password/state";
                this.$.ajax.method = "PUT";
                this.$.ajax.body = {state: "RequirePasswordChange"};
                this.$.ajax.generateRequest();
            },

            _removeUser: function (e) {
                var user = e.model.item;
                if (!confirm("Do you really want to delete user " + user.username + ": " + user.firstname + " " + user.lastname)) {
                    return;
                }

                this.dlgTitle = "Remove user failed";
                this._handleAjaxResponse = function (data) {
                    this.reload();
                };

                this.$.ajax.url = this.basePath + "rest/strolch/privilege/users/" + user.userId;
                this.$.ajax.method = "DELETE";
                this.$.ajax.body = {};
                this.$.ajax.generateRequest();
            },

            _addOrUpdateUser: function () {

                var msg = this._validateUser(this.user);
                if (this.isNotEmptyString(msg)) {
                    this.showError("Empty field", msg);
                    return;
                }

                this.dlgTitle = "Save user failed";
                this._handleAjaxResponse = function (data) {
                    this.$.userDlg.close();
                    this.reload();
                };

                if (this.isEmptyString(this.user.userId)) {
                    this.$.ajax.url = this.basePath + "rest/strolch/privilege/users";
                    this.$.ajax.method = "POST";
                } else {
                    this.$.ajax.url = this.basePath + "rest/strolch/privilege/users/" + this.user.userId;
                    this.$.ajax.method = "PUT";
                }
                this.$.ajax.body = this.user;
                this.$.ajax.generateRequest();
            },

            _validateUser: function (user) {
                if (this.isEmptyString(user.username))
                    return "Username is not set!";
                if (this.isEmptyString(user.firstname))
                    return "Firstname is not set!";
                if (this.isEmptyString(user.lastname))
                    return "Lastname is not set!";
                if (this.isEmptyString(user.userState))
                    return "User state is not set!";
                if (this.isEmptyString(user.locale))
                    return "Locale is not set!";
                if (user.groups.length === 0 && user.roles.length === 0)
                    return "No role or group selected!";

                return "";
            },

            _openAddGroupDlg: function (e) {
                this._openAddItemDlg("groups", this.user.groups, "Group");
            },
            _openAddRoleDlg: function (e) {
                this._openAddItemDlg("roles", this.user.roles, "Role");
            },

            _removeGroup: function (e) {
                var value = e.model.item;
                var list = this.user.groups;
                var path = "user.groups";
                this._removeValue(value, list, path);
            },
            _removeRole: function (e) {
                var value = e.model.item;
                var list = this.user.roles;
                var path = "user.roles";
                this._removeValue(value, list, path);
            },
            _removeValue: function (value, list, path) {
                console.log("Removing value " + value + " for path " + path);
                for (var i = 0; i < list.length; i++) {
                    if (list[i] !== value) {
                        continue;
                    }

                    list.splice(i, 1);
                    this.notifySplices(path, [
                        {
                            index: i,
                            removed: [value],
                            addedCount: 0,
                            object: list,
                            type: "splice"
                        }
                    ]);
                    this.notifyPath(path);
                }
            },

            _openAddItemDlg: function (urlSuffix, currentItems, itemsType) {
                this.itemsType = itemsType;
                this.addItemTitle = "Select " + itemsType;
                this.selectedItem = null;
                this._handleAjaxResponse = function (data) {
                    this.selectableItems = data.detail.response.filter(function (r) {
                        return !currentItems.includes(r.name);
                    });
                    this.$.addItemDlg.open();
                };

                this.$.ajax.url = this.basePath + "rest/strolch/privilege/" + urlSuffix;
                this.$.ajax.method = "GET";
                this.$.ajax.params = {};
                this.$.ajax.generateRequest();
            },
            _addItem: function (e) {
                if (this.selectedItem == null) {
                    return;
                }

                var arr;
                switch (this.itemsType) {
                    case "Group":
                        arr = this.user.groups.slice();
                        arr.push(this.selectedItem);
                        arr.sort();
                        this.set("user.groups", arr);
                        break;
                    case "Role":
                        arr = this.user.roles.slice();
                        arr.push(this.selectedItem);
                        arr.sort();
                        this.set("user.roles", arr);
                        break;
                    default:
                        this.showError("Error", "Unhandled type " + this.itemsType);
                }

                this.selectedItem = null;
                this.$.addItemDlg.close();
            },
            _addEmptyProperty: function () {
                this.push("user.properties", {
                    key: "",
                    value: ""
                });
            },
            _removeProperty: function (e) {
                var property = e.model.property;

                var i = 0;
                for (; i < this.user.properties.length; i++) {
                    if (this.user.properties[i].key === property.key) {
                        this.user.properties.splice(i, 1);
                        this.notifySplices("user.properties", [
                            {
                                index: i,
                                removed: [property],
                                addedCount: 0,
                                object: this.user.properties,
                                type: "splice"
                            }
                        ]);
                    }
                }
            },

            _addUser: function () {
                this.user = {
                    userId: "",
                    username: "",
                    firstname: "",
                    lastname: "",
                    userState: "NEW",
                    locale: "en",
                    groups: [],
                    roles: [],
                    properties: []
                };

                this.$.userDlg.open();
            },

            _openPwDlg: function (e) {
                this.user = e.model.item;
                this.password0 = "";
                this.password1 = "";
                this.$.pwDlg.open();
            },

            _showPrivileges: function (e) {
                var user = e.model.item;
                this._handleAjaxResponse = function (data) {
                    this.$.privilegesDlg.open(data.detail.response);
                };

                this.$.ajax.url = this.basePath + "rest/strolch/privilege/users/" + user.userId + "/privileges";
                this.$.ajax.method = "GET";
                this.$.ajax.params = {};
                this.$.ajax.generateRequest();
            },
            _closePrivilegesDlg: function () {
                this.$.privilegesDlg.close();
            },

            _editUser: function (e) {
                var user = JSON.parse(JSON.stringify(e.model.item));
                if (user.groups == null)
                    user.groups = [];
                if (user.roles == null)
                    user.roles = [];
                this.user = user;
                this.$.userDlg.open();
            }
        });

    </script>

</dom-module>
