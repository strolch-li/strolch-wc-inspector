<link rel="import" href="../polymer/polymer.html">
<link rel="import" href="../paper-button/paper-button.html">
<link rel="import" href="../paper-icon-button/paper-icon-button.html">
<link rel="import" href="../paper-dropdown-menu/paper-dropdown-menu.html">
<link rel="import" href="../paper-item/paper-item.html">
<link rel="import" href="../paper-listbox/paper-listbox.html">
<link rel="import" href="../paper-input/paper-input.html">
<link rel="import" href="../paper-dialog/paper-dialog.html">

<link rel="import" href="../strolch-wc-styles/strolch-wc-styles.html">
<link rel="import" href="../strolch-wc-localize-behavior/strolch-wc-localize-behavior.html">
<link rel="import" href="strolch-wc-inspector-behavior.html">

<dom-module id="strolch-wc-policy-types">

	<template>

		<style is="custom-style" include="strolch-wc-app-style">

			:host {
				display: block;
			}

			.policy-row {
				display: flex;
				flex-direction: column;
				margin-bottom: 2em;
				padding: 1em;
				border: 1px solid var(--paper-grey-200);
				border-radius: 4px;
				background-color: var(--paper-grey-50);
			}

			.policy-info {
				margin-bottom: 1em;
			}

			.policy-type {
				font-weight: bold;
				font-size: 1.1em;
			}

			.policy-api {
				font-size: 0.9em;
				color: var(--paper-grey-600);
			}

			.policy-selection {
				width: 100%;
			}

			.policy-mapping-row {
				display: flex;
				align-items: baseline;
				margin-bottom: 1em;
			}

			.policy-mapping-id {
				flex: 0 0 300px;
				padding-right: 1em;
			}

			.policy-mapping-value {
				flex: 1;
				padding-right: 1em;
			}

			paper-dropdown-menu {
				width: 100%;
			}

		</style>

		<div class="policy-row">
			<div class="policy-info">
				<div class="policy-type">[[policyType.type]]</div>
				<div class="policy-api">[[policyType.api]]</div>
			</div>

			<div class="policy-selection">
				<template is="dom-repeat" items="[[_toArray(policyType.policyByKeyMap)]]"
						  as="mapping">
					<div class="policy-mapping-row">
						<div class="policy-mapping-id"><b>[[mapping.id]]</b></div>
						<div class="policy-mapping-value">
							<paper-dropdown-menu no-label-float
												 label="[[localize('implementation')]]">
								<paper-listbox class="dropdown-content" attr-for-selected="value"
											   selected="{{mapping.value}}"
											   on-iron-select="_onPolicyChanged">
									<template is="dom-repeat"
											  items="[[policyType.possibleImplementations]]"
											  as="impl">
										<paper-item value="[[impl]]">[[impl]]</paper-item>
									</template>
								</paper-listbox>
							</paper-dropdown-menu>
						</div>
						<div>
							<paper-icon-button icon="delete" title="[[localize('delete')]]"
											   on-tap="_removePolicyKey"></paper-icon-button>
						</div>
					</div>
				</template>

				<div class="g-mt-2">
					<paper-button raised on-tap="_openAddPolicyDialog" class="g-secondary">
						[[localize('addPolicyKey')]]
					</paper-button>
				</div>
			</div>
		</div>

		<paper-dialog id="addPolicyDialog" with-backdrop no-cancel-on-outside-click>
			<div class="dialog-headline">
				<h2>[[localize('addPolicyKey')]]</h2>
			</div>
			<div class="dialog-content">
				<paper-input label="[[localize('policyKey')]]" value="{{_newPolicyKey}}"></paper-input>
				<paper-dropdown-menu label="[[localize('implementation')]]" value="{{_newPolicyImpl}}">
					<paper-listbox class="dropdown-content" attr-for-selected="value" selected="{{_newPolicyImpl}}">
						<template is="dom-repeat" items="[[policyType.possibleImplementations]]" as="impl">
							<paper-item value="[[impl]]">[[impl]]</paper-item>
						</template>
					</paper-listbox>
				</paper-dropdown-menu>
			</div>
			<div class="buttons">
				<paper-button dialog-dismiss>[[localize('cancel')]]</paper-button>
				<paper-button dialog-confirm on-tap="_addPolicyKey">[[localize('addPolicyKey')]]</paper-button>
			</div>
		</paper-dialog>

	</template>

	<script>
		Polymer({
			is: 'strolch-wc-policy-types',

			behaviors: [
				StrolchInspectorBehavior,
				StrolchLocalizeBehavior
			],

			properties: {
				localesPath: {
					type: String,
					value: './strolch-wc-configuration-locales.json'
				},
				policyType: {
					type: Object,
					value: function () {
						return {};
					}
				},
				policyModel: {
					type: Object,
					value: function () {
						return {};
					}
				},
				_newPolicyKey: {
					type: String,
					value: ''
				},
				_newPolicyImpl: {
					type: String,
					value: ''
				}
			},

			_toArray: function (obj) {
				if (!obj) return [];
				var array = Object.keys(obj).map(function (key) {
					var val = obj[key];
					if (typeof val === 'object' && val !== null && !Array.isArray(val)) {
						val.id = key;
					} else {
						val = {id: key, value: val};
					}
					return val;
				});
				array.forEach(function (item) {
					if (!item.name) item.name = item.id;
				});
				return array;
			},

			_onPolicyChanged: function (e) {
				// Binding handles update
			},

			_openAddPolicyDialog: function (e) {
				this._newPolicyKey = '';
				this._newPolicyImpl = '';
				this.$.addPolicyDialog.open();
			},

			_addPolicyKey: function (e) {
				var policyType = this.policyType;
				if (!policyType) return;
				if (!policyType.policyByKeyMap) {
					policyType.policyByKeyMap = {};
				}
				var key = this._newPolicyKey;
				var impl = this._newPolicyImpl;
				if (!key || !impl) return;
				policyType.policyByKeyMap[key] = impl;
				this._newPolicyKey = '';
				this._newPolicyImpl = '';
				this.notifyPath('policyType.policyByKeyMap');
				this.fire('strolch-policy-model-changed');
			},

			_removePolicyKey: function (e) {
				var policyType = this.policyType;
				var mapping = e.model.mapping;
				if (policyType && policyType.policyByKeyMap && mapping) {
					delete policyType.policyByKeyMap[mapping.id];
					this.notifyPath('policyType.policyByKeyMap');
					this.fire('strolch-policy-model-changed');
				}
			}
		});
	</script>

</dom-module>
